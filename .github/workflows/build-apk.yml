
name: Build Shattered Moon APK

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Unpack the uploaded game
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Shattered_Moon_Stage60_Direct_APK_Publish_Fix.zip"
          test -s "$ZIP"
          mkdir -p game
          unzip -oq "$ZIP" -d game
          test -f game/project.godot
          test -f game/Main.tscn
          test -f game/export_presets.cfg
          mkdir -p game/builds game/build_logs

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"

      - name: Install Godot 4.4.1 and matching templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.4.1-stable"
          TEMPLATES="4.4.1.stable"
          BASE="https://github.com/godotengine/godot-builds/releases/download/$VERSION"
          mkdir -p "$RUNNER_TEMP/shattered-godot"
          cd "$RUNNER_TEMP/shattered-godot"
          curl -fL --retry 3 -o godot.zip "$BASE/Godot_v${VERSION}_linux.x86_64.zip"
          unzip -oq godot.zip
          chmod +x "Godot_v${VERSION}_linux.x86_64"
          echo "GODOT_BIN=$PWD/Godot_v${VERSION}_linux.x86_64" >> "$GITHUB_ENV"
          curl -fL --retry 3 -o templates.tpz "$BASE/Godot_v${VERSION}_export_templates.tpz"
          unzip -oq templates.tpz
          test -s templates/android_debug.apk
          mkdir -p "$HOME/.local/share/godot/export_templates/$TEMPLATES"
          cp -a templates/. "$HOME/.local/share/godot/export_templates/$TEMPLATES/"
          test -s "$HOME/.local/share/godot/export_templates/$TEMPLATES/android_debug.apk"

      - name: Configure Android export and debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            > "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Check the game files
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 game/tools/preflight.py

      - name: Import the Godot project
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s "$GODOT_BIN" --headless --path game --editor --import --quit 2>&1 | tee game/build_logs/import.log
          python3 game/tools/check_engine_log.py game/build_logs/import.log

      - name: Export and verify real APK
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s "$GODOT_BIN" --headless --path game --export-debug Android "$GITHUB_WORKSPACE/game/builds/Shattered_Moon.apk" 2>&1 | tee game/build_logs/export.log
          python3 game/tools/check_engine_log.py game/build_logs/export.log
          python3 game/tools/verify_apk.py game/builds/Shattered_Moon.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose game/builds/Shattered_Moon.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging game/builds/Shattered_Moon.apk | grep "package: name='org.shatteredmoon.rebuild'"

      - name: Upload APK for download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredMoon-APK
          path: game/builds/Shattered_Moon.apk
          if-no-files-found: error
          retention-days: 14

      - name: Save error logs if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredMoon-Build-Logs
          path: game/build_logs/*.log
          if-no-files-found: warn
